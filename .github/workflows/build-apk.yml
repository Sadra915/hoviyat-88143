name: Build Hoviyat APKs

# اجرا: این فایل را در ریپوی گیت‌هاب پروژه، مسیر .github/workflows/build-apk.yml قرار بده،
# و push کن. بعد از چند دقیقه، از تب Actions روی همین ریپو، APKهای هردو اپ (اصلی + ادمین)
# به‌عنوان "Artifacts" قابل دانلودن — بدون نیاز به نصب هیچ‌چیزی روی کامپیوتر خودت.
#
# نکته: APK ساخته‌شده اینجا امضای debug دارد (برای تست/نصب مستقیم کافی است). برای
# انتشار در Google Play باید جدا امضای release بزنی (این فایل آن مرحله را انجام نمی‌دهد،
# چون کلید امضا باید محرمانه و دست خودت بماند، نه در یک workflow عمومی).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب پکیج‌ها
        run: npm install

      - name: ساخت dist-app و dist-admin
        run: npm run build:dist

      - name: افزودن پروژه‌ی اندروید (اپ اصلی)
        run: npx cap add android --config capacitor.config.app.json
      - name: sync اپ اصلی
        run: npx cap sync android --config capacitor.config.app.json
      - name: build دیباگ اپ اصلی
        run: cd android && ./gradlew assembleDebug && cd ..
      - name: آپلود APK اپ اصلی
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: حذف پروژه‌ی قبلی برای ساخت اپ ادمین
        run: rm -rf android
      - name: افزودن پروژه‌ی اندروید (اپ ادمین)
        run: npx cap add android --config capacitor.config.admin.json
      - name: sync اپ ادمین
        run: npx cap sync android --config capacitor.config.admin.json
      - name: build دیباگ اپ ادمین
        run: cd android && ./gradlew assembleDebug && cd ..
      - name: آپلود APK اپ ادمین
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-admin-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
