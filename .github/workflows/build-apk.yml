name: Build Hoviyat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب پکی��‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت dist-app
        run: npm run build:dist

      - name: افزودن Android
        run: npx cap add android

      - name: Patch Deep Link
        run: node scripts/patch-android-deeplink.mjs || echo "⚠️ Deep link patch skipped"

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: ✅ Build Complete
        run: |
          echo "🎉 Build اپلیکیشن با موفقیت انجام شد!"
          echo "📦 APK در Artifacts بخش موجود است"
