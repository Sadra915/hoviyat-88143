name: Build Hoviyat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب پکیج‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت dist-app
        run: npm run build:dist

      # =========================
      # HOVIYAT APP
      # =========================

      - name: آماده‌سازی کانفیگ اپ اصلی
        run: cp capacitor.config.app.json capacitor.config.json

      - name: افزودن Android اپ اصلی
        run: npx cap add android

      - name: Patch Deep Link اپ اصلی
        run: node scripts/patch-android-deeplink.mjs || true

      - name: بررسی Deep Link اپ اصلی
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -q 'android:scheme="ir.hoviyat.app"' android/app/src/main/AndroidManifest.xml && echo "✅ Deep Link OK" || echo "⚠️ Deep Link might not be configured"
          else
            echo "⚠️ AndroidManifest.xml not found"
          fi

      - name: Sync اپ اصلی
        run: npx cap sync android

      - name: Build APK اپ اصلی
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: آپلود APK اپ اصلی
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: ✅ Build Complete
        run: echo "APK اپ اصلی با موفقیت ساخته شد!"
