name: Build Hoviyat APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب پکیج‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت dist-app و dist-admin
        run: npm run build:dist

      # =========================
      # HOVIYAT APP
      # =========================

      - name: آماده‌سازی کانفیگ اپ اصلی
        run: cp capacitor.config.app.json capacitor.config.json

      - name: افزودن Android اپ اصلی
        run: npx cap add android

      - name: Patch Deep Link اپ اصلی
        run: node scripts/patch-android-deeplink.mjs

      - name: بررسی Deep Link اپ اصلی
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="ir.hoviyat.app"' android/app/src/main/AndroidManifest.xml

      - name: Sync اپ اصلی
        run: npx cap sync android

      - name: Build APK اپ اصلی
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: آپلود APK اپ اصلی
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # =========================
      # HOVIYAT ADMIN
      # =========================

      - name: حذف Android قبلی
        run: rm -rf android

      - name: آماده‌سازی کانفیگ اپ ادمین
        run: cp capacitor.config.admin.json capacitor.config.json

      - name: افزودن Android اپ ادمین
        run: npx cap add android

      - name: Patch Deep Link اپ ادمین
        run: node scripts/patch-android-deeplink.mjs

      - name: بررسی Deep Link اپ ادمین
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="ir.hoviyat.admin"' android/app/src/main/AndroidManifest.xml

      - name: Sync اپ ادمین
        run: npx cap sync android

      - name: Build APK اپ ادمین
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: آپلود APK اپ ادمین
        uses: actions/upload-artifact@v4
        with:
          name: hoviyat-admin-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
