<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هویت</title>

<style>
body{
    margin:0;
    background:#111827;
    color:#fff;
    font-family:Tahoma,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    width:90%;
    max-width:450px;
    background:#1f2937;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.logo{
    font-size:60px;
    margin-bottom:15px;
}
h1{
    margin:0;
    color:#ff6b00;
}
p{
    color:#d1d5db;
    line-height:1.9;
}
button{
    margin-top:20px;
    background:#ff6b00;
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#ff812e;
}
</style>
</head>

<body>

<div class="box">
    <div class="logo">⚠️</div>

    <h1>پیام‌رسان هویت</h1>

    <p>
        در حال حاضر دسترسی به سرویس امکان‌پذیر نیست.
        <br><br>
    پیام رسان هویت برای بروزرسانی امنیتی و شرایط اضطراری از دسترس خارج شده 
    </p>

    <button onclick="location.reload()">
        تلاش مجدد
    </button>
</div>

</body>
</html>
